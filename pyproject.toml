[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-chronicle"
version = "0.1.0"
description = "Feature lifecycle traceability for AI-assisted development"
requires-python = ">=3.12"
dependencies = ["click>=8.0"]

[project.optional-dependencies]
embed = ["sqlite-vec", "sentence-transformers"]

[project.scripts]
chronicle = "chronicle.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["chronicle*"]
